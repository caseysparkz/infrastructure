# Author:       Casey Sparks
# Date:         November 15, 2023
# Description:  Run dagger python checks.
---
name: "python"
on:
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.py"
      - "**/pyproject.toml"
      - "**/pylock.toml"
jobs:
  dagger_check:
    name: "dagger"
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - name: "git checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 2

      - name: "aws sso login"
        uses: "aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c"  # v6.2.3
        with:
          aws-region: "${{ secrets.AWS_DEFAULT_REGION }}"
          role-to-assume: "${{ secrets.AWS_ROLE_ARN }}"
          role-session-name: "gha-${{ github.run_id }}"

      - name: "dagger check python:*"
        uses: "./.github/actions/dagger-check"
        with:
          filter: "python:*"
