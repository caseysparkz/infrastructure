[project]
name = "cs-monorepo"
description = "Global installer for the monorepo."
requires-python = ">=3.13"
version = "0.1.0"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "CaseySparkz", email = "contact@caseysparkz.com" }]
dependencies = [
    "cs-ansible @ file:./ansible",
    "boto3==1.43.64",
]

[project.optional-dependencies]
test = [
    "boto3-stubs==1.43.64",
    "botocore-stubs==1.40.61",
    "ipdb==0.13.13",
    "moto==5.2.2",
    "mypy==2.3.0",
    "pip-audit==2.10.1",
    "pytest-cov==7.1.0",
    "pytest==9.1.1",
    "ruff==0.16.1",
    "types-boto3[ses]",
    "yamllint==1.38.0",
]
dev = [
    "cs-monorepo[test]",

    "ipython==9.15.0",
]
tools = [
    "prowler==5.37.1", # AWS posture scanning
]
all = [
    "cs-monorepo[dev]",
    "cs-monorepo[test]",
    "cs-monorepo[tools]",
]

[tool.setuptools.packages.find]
where = []

[build-system]
build-backend = "setuptools.build_meta"
requires-python = ">= 3.13"
requires = ["setuptools"]

# Tools ========================================================================
# Misc. -----------------------------------------------------------------------
[tool.ipdb]
context = 20
